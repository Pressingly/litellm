model_list:
  - model_name: gpt-3.5-turbo
    litellm_params:
      model: azure/my_azure_deployment
      api_base: os.environ/AZURE_API_BASE
      api_key: "os.environ/AZURE_API_KEY"
      api_version: "2024-07-01-preview" # [OPTIONAL] litellm uses the latest azure api_version by default
  - model_name: gemini-2.0-flash
    litellm_params:
      model: gemini/gemini-2.0-flash
      api_key: "os.environ/GOOGLE_API_KEY"
  - model_name: gemini-2.5-pro-preview-03-25
    litellm_params:
      model: gemini/gemini-2.5-pro-preview-03-25
      api_key: "os.environ/GOOGLE_API_KEY"
  - model_name: gemini-2.0-flash-lite
    litellm_params:
      model: gemini/gemini-2.0-flash-lite
      api_key: "os.environ/GOOGLE_API_KEY"
  
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: "os.environ/OPENAI_API_KEY"
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: "os.environ/OPENAI_API_KEY"
  - model_name: gpt-o1-mini
    litellm_params:
      model: openai/o1-mini
      api_key: "os.environ/OPENAI_API_KEY"
  
  # Vertex AI Models - Gemini
  - model_name: vertex-gemini-pro
    litellm_params:
      model: vertex_ai/gemini-pro
      vertex_project: os.environ/VERTEX_PROJECT
      vertex_location: os.environ/VERTEX_LOCATION
  
  - model_name: vertex-gemini-pro-vision
    litellm_params:
      model: vertex_ai/gemini-pro-vision
      vertex_project: os.environ/VERTEX_PROJECT
      vertex_location: os.environ/VERTEX_LOCATION
  
  - model_name: vertex-gemini-1.5-pro
    litellm_params:
      model: vertex_ai/gemini-1.5-pro-001
      vertex_project: os.environ/VERTEX_PROJECT
      vertex_location: os.environ/VERTEX_LOCATION
  
  - model_name: vertex-gemini-1.5-flash
    litellm_params:
      model: vertex_ai/gemini-1.5-flash-001
      vertex_project: os.environ/VERTEX_PROJECT
      vertex_location: os.environ/VERTEX_LOCATION
  
  # Vertex AI Models - PaLM/Bison
  - model_name: vertex-text-bison
    litellm_params:
      model: vertex_ai/text-bison
      vertex_project: os.environ/VERTEX_PROJECT
      vertex_location: os.environ/VERTEX_LOCATION
  
  - model_name: vertex-chat-bison
    litellm_params:
      model: vertex_ai/chat-bison
      vertex_project: os.environ/VERTEX_PROJECT
      vertex_location: os.environ/VERTEX_LOCATION
  
  # Vertex AI Models - Code Generation
  - model_name: vertex-code-bison
    litellm_params:
      model: vertex_ai/code-bison
      vertex_project: os.environ/VERTEX_PROJECT
      vertex_location: os.environ/VERTEX_LOCATION
  
  - model_name: vertex-codechat-bison
    litellm_params:
      model: vertex_ai/codechat-bison
      vertex_project: os.environ/VERTEX_PROJECT
      vertex_location: os.environ/VERTEX_LOCATION

litellm_settings:
  # callbacks: ["entitlement_callback.entitlement_checker"]  # Temporarily disabled for Vertex AI testing
  drop_params: true
  set_verbose: false